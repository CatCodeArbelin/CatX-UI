name: Release CatX-UI for Docker

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the manually selected CatX image tags to GHCR
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish == true }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/catcodearbelin/catx-ui
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert CatX image ownership
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eiq '(^|/)(hsanaeii/3x-ui|ghcr\.io/mhsanaei/3x-ui)(:|$)' <<<"$IMAGE_TAGS"; then
            echo "upstream-owned Docker image target detected" >&2
            exit 1
          fi
          while IFS= read -r image; do
            [[ -z "$image" ]] && continue
            [[ "$image" == ghcr.io/catcodearbelin/catx-ui:* ]] || {
              echo "unexpected Docker image target: $image" >&2
              exit 1
            }
          done <<<"$IMAGE_TAGS"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          provenance: mode=max
          sbom: true
          platforms: linux/amd64,linux/arm64/v8,linux/arm/v7,linux/arm/v6,linux/386
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
