name: RC-6 Linux published RC-3 observation

on:
  push:
    tags:
      - "v0.1.0-rc.3"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published CatX RC tag to observe
        required: true
        default: v0.1.0-rc.3
        type: string
      release_commit:
        description: Exact qualified commit recorded in the release metadata
        required: true
        type: string

permissions:
  contents: read

jobs:
  observe-published-rc3:
    name: Observe actual published RC-3 assets on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.release_commit }}
      - name: Install Linux observation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends curl jq iproute2 nftables unzip
          sudo modprobe ifb numifbs=8 || true
      - name: Wait for the tagged release assets
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "https://api.github.com/repos/CatCodeArbelin/CatX-UI/releases/tags/${RELEASE_TAG}" > "$RUNNER_TEMP/release.json"; then
              if jq -e --arg a catx-ui-linux-amd64.tar.gz --arg b catx-ui-release-metadata.json '(.draft == false and .prerelease == true and ([.assets[].name] | index($a)) != null and ([.assets[].name] | index($b)) != null)' "$RUNNER_TEMP/release.json" >/dev/null; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "published assets for ${RELEASE_TAG} were not ready" >&2
          exit 1
      - name: Observe the actual published RC-3 payload
        env:
          CATX_RC6_PUBLIC_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          CATX_RC6_PUBLIC_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          CATX_RC6_PUBLIC_COMMIT: ${{ github.event_name == 'push' && github.sha || inputs.release_commit }}
          CATX_RC6_EVIDENCE_DIR: ${{ runner.temp }}/catx-rc6-rc3-linux-evidence
        run: |
          set -euo pipefail
          public_version="${CATX_RC6_PUBLIC_VERSION#v}"
          CATX_RC6_PUBLIC_VERSION="$public_version" \
            sudo --preserve-env=CATX_RC6_PUBLIC_TAG,CATX_RC6_PUBLIC_VERSION,CATX_RC6_PUBLIC_COMMIT,CATX_RC6_EVIDENCE_DIR \
            bash scripts/staging/observe-rc2-linux.sh
      - name: Summarize sanitized RC-3 evidence
        if: always()
        run: |
          evidence="${RUNNER_TEMP}/catx-rc6-rc3-linux-evidence"
          if [ -d "$evidence" ]; then
            find "$evidence" -maxdepth 1 -type f -printf '%f\n' | sort
            if [ -f "$evidence/observation.log" ]; then cat "$evidence/observation.log"; fi
          fi
      - name: Upload sanitized RC-3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-rc3-linux-observation-${{ github.run_id }}
          path: ${{ runner.temp }}/catx-rc6-rc3-linux-evidence
          if-no-files-found: warn
          retention-days: 30
