name: Deploy Smoke Tests

# Before a release exists, branch/PR runs exercise release identity and the
# updater transaction/rollback state machine hermetically. After a tagged
# release finishes uploading its checksummed assets, the container smoke test
# installs that exact tag and verifies the actual distribution being shipped.
# Tag pushes must NOT trigger the unpinned job directly: at that moment
# releases/latest still points at the previous release (#5756), and a `paths`
# filter alone cannot exclude them because a brand-new tag ref has no diff
# base, so it runs on every tag push.

on:
  push:
    branches:
      - "**"
    paths:
      - "install.sh"
      - "update.sh"
      - "x-ui.sh"
      - "scripts/catx-update-transaction.sh"
      - "scripts/test-release-identity.sh"
      - "scripts/test-update-transaction.sh"
      - "internal/forkrelease/**"
      - "deploy/**"
      - ".github/workflows/smoke.yml"
  pull_request:
    paths:
      - "install.sh"
      - "update.sh"
      - "x-ui.sh"
      - "scripts/catx-update-transaction.sh"
      - "scripts/test-release-identity.sh"
      - "scripts/test-update-transaction.sh"
      - "internal/forkrelease/**"
      - "deploy/**"
      - ".github/workflows/smoke.yml"
  workflow_run:
    workflows: ["Release CatX-UI"]
    types: [completed]

permissions:
  contents: read

jobs:
  pre-release-updater-safety:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate release identity and updater rollback
        run: |
          bash scripts/test-release-identity.sh
          bash scripts/test-update-transaction.sh

  release-tag-install:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      contains(github.event.workflow_run.head_branch, '.')
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Pinned release install smoke test
        env:
          XUI_SMOKE_VERSION: ${{ github.event.workflow_run.head_branch }}
        run: bash deploy/test/smoke-noninteractive.sh "$XUI_SMOKE_VERSION"
