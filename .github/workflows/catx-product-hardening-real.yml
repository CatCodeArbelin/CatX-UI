name: CatX v0.3 product hardening qualification

on:
  push:
    branches: [feature/v0.3-product-hardening]
    paths:
      - '.github/workflows/catx-product-hardening-real.yml'
      - 'scripts/staging/observe-product-hardening-real-linux.sh'
      - 'scripts/staging/observe-product-hardening-real-browser.mjs'
      - 'internal/forkext/**'
      - 'internal/analytics/**'
      - 'internal/policy/**'
      - 'internal/policysim/**'
      - 'internal/web/web.go'
      - 'internal/web/controller/**'
      - 'frontend/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-panel:
    name: Disposable real-panel lifecycle and browser qualification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux qualification dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends curl jq unzip
      - name: Build frontend bundle
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install Chromium for real-panel browser qualification
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: npx playwright install --with-deps chromium
      - name: Build exact candidate and Xray
        run: |
          set -euo pipefail
          go build -buildvcs=false -ldflags '-s -w' -o "$RUNNER_TEMP/catx-hardening-candidate-x-ui" .
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 -o "$RUNNER_TEMP/xray.zip" 'https://github.com/XTLS/Xray-core/releases/download/v26.9.9/Xray-linux-64.zip'
          unzip -q "$RUNNER_TEMP/xray.zip" xray geoip.dat geosite.dat -d "$RUNNER_TEMP/xray-unpacked"
          install -m 0755 "$RUNNER_TEMP/xray-unpacked/xray" "$RUNNER_TEMP/xray-linux-amd64"
          mkdir -p "$RUNNER_TEMP/xray-assets"
          install -m 0644 "$RUNNER_TEMP/xray-unpacked/geoip.dat" "$RUNNER_TEMP/xray-assets/geoip.dat"
          install -m 0644 "$RUNNER_TEMP/xray-unpacked/geosite.dat" "$RUNNER_TEMP/xray-assets/geosite.dat"
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-only: true
      - name: Run focused Go qualification before the real panel
        run: go test -count=1 ./internal/analytics ./internal/policy ./internal/policysim ./internal/forkext/trafficpolicy ./internal/forkext
      - name: Run make verify
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: make verify
      - name: Diagnose make verify prerequisites after failure
        if: failure()
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: |
          set +e
          failed=0
          for target in gen-check lint format-check typecheck msw-worker-check test build build-storybook; do
            echo "diagnosing make ${target}"
            log_file="$(mktemp)"
            if [ "${target}" = "test" ]; then
              env GITHUB_ACTIONS= make "${target}" >"${log_file}" 2>&1
            else
              make "${target}" >"${log_file}" 2>&1
            fi
            status=$?
            cat "${log_file}"
            if [ "$status" -ne 0 ]; then
              echo "::error title=make verify target failed::make ${target} exited ${status}"
              details="$(grep -E 'FAIL|AssertionError|expected|Test Files|Tests|❯|Error:' "${log_file}" | tail -n 60 || true)"
              if [ -z "${details}" ]; then
                details="$(tail -n 40 "${log_file}")"
              fi
              details="$(printf '%s' "${details}" | tr '\n' ' ')"
              details="${details//'%'/'%25'}"
              details="${details//$'\r'/'%0D'}"
              details="${details//$'\n'/'%0A'}"
              echo "::error title=make ${target} failure::${details:0:12000}"
              failed=1
            fi
            rm -f "${log_file}"
          done
          exit "$failed"
      - name: Run make verify-fork
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: make verify-fork
      - name: Run authenticated hardening lifecycle on the real panel
        env:
          CATX_HARDENING_CANDIDATE_BINARY: ${{ runner.temp }}/catx-hardening-candidate-x-ui
          CATX_HARDENING_CANDIDATE_XRAY_BINARY: ${{ runner.temp }}/xray-linux-amd64
          CATX_HARDENING_CANDIDATE_XRAY_ASSET_DIR: ${{ runner.temp }}/xray-assets
          CATX_HARDENING_CANDIDATE_SHA: ${{ github.sha }}
          CATX_HARDENING_EVIDENCE_DIR: ${{ runner.temp }}/catx-hardening-real-evidence
          CATX_HARDENING_RUN_BROWSER: '1'
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: |
          set +e
          set -uo pipefail
          failure_log="$RUNNER_TEMP/catx-hardening-real.log"
          rm -f "$failure_log"
          sudo env \
            "CATX_HARDENING_CANDIDATE_BINARY=$CATX_HARDENING_CANDIDATE_BINARY" \
            "CATX_HARDENING_CANDIDATE_XRAY_BINARY=$CATX_HARDENING_CANDIDATE_XRAY_BINARY" \
            "CATX_HARDENING_CANDIDATE_XRAY_ASSET_DIR=$CATX_HARDENING_CANDIDATE_XRAY_ASSET_DIR" \
            "CATX_HARDENING_CANDIDATE_SHA=$CATX_HARDENING_CANDIDATE_SHA" \
            "CATX_HARDENING_EVIDENCE_DIR=$CATX_HARDENING_EVIDENCE_DIR" \
            "CATX_HARDENING_RUN_BROWSER=$CATX_HARDENING_RUN_BROWSER" \
            "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" \
            bash scripts/staging/observe-product-hardening-real-linux.sh 2>&1 | tee "$failure_log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            details="$(tail -n 80 "$failure_log")"
            details="$(printf '%s' "$details" | tr '\n' ' ')"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=real-panel qualification failure::${details:0:12000}"
            exit "$status"
          fi
      - name: Upload sanitized real-panel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catx-product-hardening-real-${{ github.run_id }}
          path: ${{ runner.temp }}/catx-hardening-real-evidence
          if-no-files-found: warn
          retention-days: 30

  go-test:
    name: Full Go test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Stub internal/web/dist for go:embed
        run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
      - name: Test
        run: |
          go list ./... | grep -v '/frontend/node_modules/' > /tmp/go-packages.txt
          go test -shuffle=on -count=1 $(cat /tmp/go-packages.txt)

  postgres-qualification:
    name: PostgreSQL migration and durability qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xui_durable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xui_durable"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      XUI_DB_TYPE: postgres
      XUI_DB_DSN: "host=127.0.0.1 port=5432 user=postgres password=postgres dbname=xui_durable sslmode=disable"
      XUI_TEST_PG_DSN: "postgres://postgres:postgres@127.0.0.1:5432/xui_durable?sslmode=disable"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Stub internal/web/dist for go:embed
        run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
      - name: PostgreSQL durable-first tests
        run: |
          set -o pipefail
          go test ./internal/web/service -run 'PostgresCommitFailure' -count=1 -v | tee /tmp/postgres-durable-first.log
          passed=$(grep -c -- '--- PASS' /tmp/postgres-durable-first.log || true)
          if [ "$passed" -lt 1 ]; then
            echo "expected at least 1 passing durable-first test, got $passed" >&2
            exit 1
          fi
      - name: PostgreSQL schema and migration tests
        run: |
          set -o pipefail
          go test ./internal/database -run '^(TestHostAutoMigrateCreatesColumns_Postgres|TestMigrate_Postgres|TestClientWeeklyRenewMigration_Postgres)$' -count=1 -v | tee /tmp/postgres-schema.log
          passed=$(grep -c -- '^--- PASS' /tmp/postgres-schema.log || true)
          if [ "$passed" -lt 3 ]; then
            echo "expected at least 3 passing PostgreSQL schema tests, got $passed" >&2
            exit 1
          fi
          go test ./internal/forkext/sponsors -run '^TestSponsorsSchemaPostgres$' -count=1 -v | tee /tmp/postgres-sponsors.log
          passed=$(grep -c -- '^--- PASS: TestSponsorsSchemaPostgres' /tmp/postgres-sponsors.log || true)
          if [ "$passed" -ne 1 ]; then
            echo "expected exactly 1 passing Sponsors PostgreSQL schema test, got $passed" >&2
            exit 1
          fi

  codegen:
    name: Generated schema and OpenAPI drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Regenerate schemas, examples and OpenAPI
        run: npm run gen
        working-directory: frontend
      - name: Fail if generated files are stale
        run: git diff --exit-code -- frontend/src/generated frontend/public/openapi.json

  govulncheck:
    name: Go vulnerability qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Stub internal/web/dist for go:embed
        run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  race:
    name: Go race and shuffle qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Stub internal/web/dist for go:embed
        run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
      - name: Race and shuffle
        run: |
          go list ./... | grep -v '/frontend/node_modules/' > /tmp/go-packages.txt
          go test -race -shuffle=on -count=1 -timeout 25m $(cat /tmp/go-packages.txt)

  fuzz-smoke:
    name: Critical parser fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Stub internal/web/dist for go:embed
        run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
      - name: Fuzz critical parsers
        run: |
          go test -run '^$' -fuzz 'FuzzParseLink$' -fuzztime=30s ./internal/util/link/
          go test -run '^$' -fuzz 'FuzzDecodeCertPin$' -fuzztime=30s ./internal/web/runtime/

  frontend-qualification:
    name: Frontend qualification and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Verify generated MSW worker is current
        run: git diff --exit-code -- public/mockServiceWorker.js package-lock.json
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Format check
        run: npm run format:check
        working-directory: frontend
      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: Install Playwright Chromium
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: npx playwright install --with-deps chromium
      - name: Test
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: npm test
      - name: Build
        run: npm run build
        working-directory: frontend
      - name: Build Storybook
        run: npm run build-storybook
        working-directory: frontend
      - name: Audit
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
