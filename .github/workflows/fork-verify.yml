name: Fork verification
# WP-8B canonical retry marker.

on:
  pull_request:
    paths:
      - "**.go"
      - "**.sh"
      - "internal/forkrelease/**"
      - "go.mod"
      - "go.sum"
      - "frontend/**"
      - ".nvmrc"
      - "Makefile"
      - ".github/workflows/**"
  push:
    branches:
      - "feature/*"
    paths:
      - "**.go"
      - "**.sh"
      - "internal/forkrelease/**"
      - "go.mod"
      - "go.sum"
      - "frontend/**"
      - ".nvmrc"
      - "Makefile"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  verify-fork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright Chromium (Storybook story tests)
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-only: true
      - name: Run upstream and fork verification
        shell: bash
        run: |
          set +e
          run_gate() {
            label="$1"
            target="$2"
            echo "::group::$label"
            make "$target" 2>&1 | tee "$RUNNER_TEMP/$target.log"
            status=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error file=Makefile,title=$label failure::$target exited with status $status"
              return "$status"
            fi
          }
          status=0
          run_gate "Generated contract check" gen-check || status=$?
          if [ "$status" -eq 0 ]; then
            run_gate "Go lint" lint-go || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_gate "Frontend lint" lint-fe || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_gate "Frontend format check" format-check || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_gate "Frontend typecheck" typecheck || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_gate "MSW worker check" msw-worker-check || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_gate "Go tests" test-go || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_gate "Frontend tests" test-fe || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_gate "Application build" build || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_gate "Storybook build" build-storybook || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_gate "Fork Go verification" test-fork-go || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_gate "Fork release verification" test-fork-release || status=$?
          fi
          set -e
          if [ "$status" -ne 0 ]; then
            git status --short | while IFS= read -r line; do
              echo "::error file=Makefile::working tree status: $line"
            done
            exit "$status"
          fi
