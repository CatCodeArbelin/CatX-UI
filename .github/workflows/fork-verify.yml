name: Fork verification

on:
  pull_request:
    paths:
      - "**.go"
      - "**.sh"
      - "internal/forkrelease/**"
      - "go.mod"
      - "go.sum"
      - "frontend/**"
      - ".nvmrc"
      - "Makefile"
      - ".github/workflows/**"
  push:
    branches:
      - "feature/wp-*"
    paths:
      - "**.go"
      - "**.sh"
      - "internal/forkrelease/**"
      - "go.mod"
      - "go.sum"
      - "frontend/**"
      - ".nvmrc"
      - "Makefile"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  verify-fork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright Chromium (Storybook story tests)
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-only: true
      - name: Run upstream and fork verification
        shell: bash
        run: |
          set +e
          make verify-fork 2>&1 | tee "$RUNNER_TEMP/verify-fork.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error file=Makefile,title=verify-fork failure::make verify-fork exited with status $status"
            git status --short | while IFS= read -r line; do
              echo "::error file=Makefile::working tree status: $line"
            done
            git diff --numstat -- frontend/src/generated frontend/public/openapi.json | while IFS= read -r line; do
              echo "::error file=Makefile::generated diff: $line"
            done
            tail -n 30 "$RUNNER_TEMP/verify-fork.log" | while IFS= read -r line; do
              line=${line//$'\r'/}
              line=${line//$'\n'/ }
              echo "::error file=Makefile::$line"
            done
            exit "$status"
          fi
